name: glycosoin
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Run the start script first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run the start script first}
    volumes:
      - medical_data:/data/db
    # No published database port: only the app can reach it on this network.
    networks: [database]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: installation/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: ${API_PORT:-8001}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/glycosoin?authSource=admin
      DB_NAME: glycosoin
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gemini-3-flash}
      SUMMARY_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gemini-3-flash}
      EMERGENT_EMAIL_KEY: ${EMERGENT_EMAIL_KEY:-}
      EMAIL_FROM_NAME: GlycoSoin T1D
      INTEGRATION_PROXY_URL: ${INTEGRATION_PROXY_URL:-}
    networks: [database, application]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/api/',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_HOST: ${APP_HOST:-glycosoin.home.arpa}
      API_PORT: ${API_PORT:-8001}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks: [application]

networks:
  database:
    internal: true
  application:
volumes:
  medical_data:
  certificates:
  caddy_config: